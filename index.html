        async function importExamHtmlFile() {
            const input = document.getElementById('exam-html-file');
            const file = input && input.files && input.files[0];
            if (!file) {
                showToast('Vui lòng chọn file HTML, PDF hoặc Word trước!', 'error');
                return;
            }
            try {
                const ext = (file.name.split('.').pop() || '').toLowerCase();
                let parsed = [];
                if (ext === 'html' || ext === 'htm') {
                    parsed = parseUploadedExamHtml(await file.text());
                } else if (ext === 'pdf') {
                    parsed = await importExamPdf(file);
                } else if (ext === 'docx') {
                    parsed = await importExamDocx(file);
                } else if (ext === 'doc') {
                    showToast('File .doc cũ chưa hỗ trợ trực tiếp. Hãy mở bằng Word và lưu thành .docx nhé.', 'error');
                    return;
                } else {
                    showToast('Hãy chọn file HTML, PDF hoặc DOCX.', 'error');
                    return;
                }
                if (!parsed.length) {
                    showToast('Chưa tìm thấy câu hỏi. Kiểm tra định dạng Câu 1 và lựa chọn a/b/c/d nhé.', 'error');
                    return;
                }
                state.editorQuiz.questions.push(...parsed);
                if (input) input.value = '';
                renderTeacherEditorView(document.getElementById('app-container'));
                const detectedCount = parsed.filter(q => ['A', 'B', 'C', 'D'].includes(q.answer)).length;
                if (detectedCount > 0) {
                    showToast(`Đã bóc tách ${parsed.length} câu hỏi (tự động nhận diện đáp án đúng ${detectedCount}/${parsed.length} câu)!`, 'success');
                } else {
                    showToast(`Đã nhập ${parsed.length} câu hỏi. Hãy kiểm tra và chọn đáp án đúng nhé.`, 'success');
                }
            } catch (err) {
                console.error(err);
                showToast('Không đọc được file. PDF cần có lớp văn bản; hãy thử mở PDF và copy chữ để kiểm tra.', 'error');
            }
        }

        // Đọc trực tiếp định dạng OOXML của DOCX để không phụ thuộc Mammoth có giữ
        // định dạng underline/bold của từng run hay không.
        async function convertDocxXmlToMarkedHtml(file) {
            if (!window.JSZip) throw new Error('Thư viện đọc cấu trúc DOCX chưa tải được');
            const zip = await JSZip.loadAsync(await file.arrayBuffer());
            const documentFile = zip.file('word/document.xml');
            if (!documentFile) throw new Error('DOCX không có word/document.xml');
            const xmlText = await documentFile.async('text');
            const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
            if (xml.querySelector('parsererror')) throw new Error('Không đọc được cấu trúc XML của DOCX');
            const local = (node, name) => node && node.localName === name;
            const getProp = (run, prop) => {
                const rPr = Array.from(run.children || []).find(n => local(n, 'rPr'));
                if (!rPr) return null;
                return Array.from(rPr.children || []).find(n => local(n, prop));
            };
            const enabled = (node) => {
                if (!node) return false;
                const val = (node.getAttribute('w:val') || node.getAttribute('val') || '').toLowerCase();
                return !['0', 'false', 'off', 'none'].includes(val);
            };
            const renderRun = (run) => {
                const underlineNode = getProp(run, 'u');
                const boldNode = getProp(run, 'b');
                const underline = enabled(underlineNode);
                const bold = enabled(boldNode);
                let value = '';
                const walk = (node) => {
                    for (const child of Array.from(node.childNodes || [])) {
                        if (child.nodeType === 3) continue;
                        if (child.nodeType !== 1) continue;
                        if (local(child, 't') || local(child, 'delText')) value += escapeHtml(child.textContent || '');
                        else if (local(child, 'tab')) value += ' ';
                        else if (local(child, 'br') || local(child, 'cr')) value += '<br>';
                        else walk(child);
                    }
                };
                walk(run);
                if (underline) value = `<u>${value}</u>`;
                if (bold) value = `<strong>${value}</strong>`;
                return value;
            };
            const renderParagraph = (paragraph) => {
                let html = '';
                const collect = (node) => {
                    for (const child of Array.from(node.children || [])) {
                        if (local(child, 'r')) html += renderRun(child);
                        else if (local(child, 'hyperlink') || local(child, 'smartTag') || local(child, 'sdt')) collect(child);
                        else if (local(child, 'p')) html += renderParagraph(child);
                    }
                };
                collect(paragraph);
                return `<p>${html}</p>`;
            };
            const body = Array.from(xml.getElementsByTagName('*')).find(n => local(n, 'body'));
            if (!body) throw new Error('Không tìm thấy nội dung DOCX');
            let html = '';
            const renderBlock = (node) => {
                if (local(node, 'p')) html += renderParagraph(node);
                else if (local(node, 'tbl')) {
                    for (const row of Array.from(node.children || []).filter(n => local(n, 'tr'))) {
                        const cells = Array.from(row.children || []).filter(n => local(n, 'tc'));
                        html += '<p>' + cells.map(cell => {
                            let cellHtml = '';
                            for (const para of Array.from(cell.children || []).filter(n => local(n, 'p'))) {
                                const m = renderParagraph(para).match(/^<p>([\s\S]*)<\/p>$/);
                                if (m) cellHtml += m[1] + ' ';
                            }
                            return cellHtml.trim();
                        }).join(' \t ') + '</p>';
                    }
                }
            };
            for (const child of Array.from(body.children || [])) renderBlock(child);
            return html;
        }

        async function importExamDocx(file) {
            try {
                const html = await convertDocxXmlToMarkedHtml(file);
                const parsed = parseWordContentHTML(html, '');
                if (parsed.length) return parsed;
            } catch (e) {
                console.warn('Đọc DOCX trực tiếp thất bại, chuyển sang Mammoth:', e);
            }
            if (!window.mammoth) throw new Error('Thư viện đọc Word chưa tải được');
            const result = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() }, {
                styleMap: ['u => u', 'ins => u', 'b => strong', 'i => em']
            });
            return parseWordContentHTML(result.value, '');
        }

        function multiplyPdfMatrices(m1, m2) {
            return [
                m1[0] * m2[0] + m1[2] * m2[1],
                m1[1] * m2[0] + m1[3] * m2[1],
                m1[0] * m2[2] + m1[2] * m2[3],
                m1[1] * m2[2] + m1[3] * m2[3],
                m1[0] * m2[4] + m1[2] * m2[5] + m1[4],
                m1[1] * m2[4] + m1[3] * m2[5] + m1[5]
            ];
        }

        function applyPdfMatrix(m, x, y) {
            return {
                x: m[0] * x + m[2] * y + m[4],
                y: m[1] * x + m[3] * y + m[5]
            };
        }

        async function extractPdfPageUnderlines(page) {
            const segments = [];
            try {
                const opList = await page.getOperatorList();
                const OPS = pdfjsLib.OPS;
                let ctm = [1, 0, 0, 1, 0, 0];
                const stack = [];
                let curX = 0;
                let curY = 0;

                const pushHorizontalSegment = (p1, p2) => {
                    const dy = Math.abs(p2.y - p1.y);
                    const dx = Math.abs(p2.x - p1.x);
                    if (dy <= 2.5 && dx >= 2.5) {
                        segments.push({
                            x1: Math.min(p1.x, p2.x),
                            x2: Math.max(p1.x, p2.x),
                            y: (p1.y + p2.y) / 2
                        });
                    }
                };

                const pushRectSegment = (x, y, w, h) => {
                    const p1 = applyPdfMatrix(ctm, x, y);
                    const p2 = applyPdfMatrix(ctm, x + w, y);
                    const p3 = applyPdfMatrix(ctm, x, y + h);
                    const realW = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    const realH = Math.hypot(p3.x - p1.x, p3.y - p1.y);
                    if (realW >= 2.5 && realH <= 3.5) {
                        segments.push({
                            x1: Math.min(p1.x, p2.x),
                            x2: Math.max(p1.x, p2.x),
                            y: (p1.y + p3.y) / 2
                        });
                    }
                };

                for (let i = 0; i < opList.fnArray.length; i++) {
                    const fn = opList.fnArray[i];
                    const args = opList.argsArray[i];
                    if (fn === OPS.save) {
                        stack.push(ctm.slice());
                    } else if (fn === OPS.restore) {
                        if (stack.length) ctm = stack.pop();
                    } else if (fn === OPS.transform && args && args.length >= 6) {
                        ctm = multiplyPdfMatrices(ctm, args);
                    } else if (fn === OPS.moveTo && args && args.length >= 2) {
                        curX = args[0];
                        curY = args[1];
                    } else if (fn === OPS.lineTo && args && args.length >= 2) {
                        const p1 = applyPdfMatrix(ctm, curX, curY);
                        const p2 = applyPdfMatrix(ctm, args[0], args[1]);
                        pushHorizontalSegment(p1, p2);
                        curX = args[0];
                        curY = args[1];
                    } else if (fn === OPS.rectangle && args && args.length >= 4) {
                        pushRectSegment(args[0], args[1], args[2], args[3]);
                    } else if (fn === OPS.constructPath && args && args.length >= 2) {
                        const subOps = args[0] || [];
                        const coords = args[1] || [];
                        let ci = 0;
                        for (let s = 0; s < subOps.length; s++) {
                            const sop = subOps[s];
                            if (sop === OPS.moveTo) {
                                curX = coords[ci++];
                                curY = coords[ci++];
                            } else if (sop === OPS.lineTo) {
                                const nx = coords[ci++];
                                const ny = coords[ci++];
                                pushHorizontalSegment(applyPdfMatrix(ctm, curX, curY), applyPdfMatrix(ctm, nx, ny));
                                curX = nx;
                                curY = ny;
                            } else if (sop === OPS.curveTo) {
                                ci += 4;
                                curX = coords[ci++];
                                curY = coords[ci++];
                            } else if (sop === OPS.curveTo2 || sop === OPS.curveTo3) {
                                ci += 2;
                                curX = coords[ci++];
                                curY = coords[ci++];
                            } else if (sop === OPS.rectangle) {
                                const rx = coords[ci++];
                                const ry = coords[ci++];
                                const rw = coords[ci++];
                                const rh = coords[ci++];
                                pushRectSegment(rx, ry, rw, rh);
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn('PDF operator list underline inspection skipped:', e);
            }
            return segments;
        }

        function formatPdfItemWithUnderlines(item, underlines) {
            const rawStr = item.str || '';
            if (!rawStr) return '';
            const trimmed = rawStr.trim();
            if (!trimmed || !underlines || !underlines.length) {
                return escapeHtml(rawStr);
            }

            const itemX = item.x;
            const itemW = item.width > 0 ? item.width : rawStr.length * (item.height * 0.5);
            const itemEndX = itemX + itemW;
            const fontSize = item.height > 0 ? item.height : 11;

            // Đường gạch chân trong PDF nằm ngay dưới đường baseline (item.y)
            const matching = underlines.filter(u =>
                u.y >= item.y - fontSize * 0.65 &&
                u.y <= item.y + fontSize * 0.35 &&
                u.x2 > itemX + 0.5 &&
                u.x1 < itemEndX - 0.5
            );

            if (!matching.length) {
                return escapeHtml(rawStr);
            }

            const charFlags = new Array(rawStr.length).fill(false);
            const charWidth = itemW / rawStr.length;
            for (let c = 0; c < rawStr.length; c++) {
                if (/\s/.test(rawStr[c])) continue;
                const cMid = itemX + (c + 0.5) * charWidth;
                for (const u of matching) {
                    if (cMid >= u.x1 - 1.2 && cMid <= u.x2 + 1.2) {
                        charFlags[c] = true;
                        break;
                    }
                }
            }

            if (!charFlags.some(Boolean)) {
                return escapeHtml(rawStr);
            }

            let out = '';
            let inU = false;
            for (let c = 0; c < rawStr.length; c++) {
                const wantU = charFlags[c] || (inU && /\s/.test(rawStr[c]) && charFlags[c + 1]);
                if (wantU && !inU) {
                    out += '<u>';
                    inU = true;
                } else if (!wantU && inU) {
                    out += '</u>';
                    inU = false;
                }
                out += escapeHtml(rawStr[c]);
            }
            if (inU) out += '</u>';
            return out;
        }

        async function importExamPdf(file) {
            if (!window.pdfjsLib) throw new Error('Thư viện đọc PDF chưa tải được');
            const workerUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            try {
                if (!window.__pdfWorkerBlobUrl) {
                    const resp = await fetch(workerUrl);
                    const code = await resp.text();
                    window.__pdfWorkerBlobUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
                }
                pdfjsLib.GlobalWorkerOptions.workerSrc = window.__pdfWorkerBlobUrl;
            } catch (e) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;
            }
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
            const pagesHtml = [];

            for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
                const page = await pdf.getPage(pageNo);
                const [content, underlines] = await Promise.all([
                    page.getTextContent(),
                    extractPdfPageUnderlines(page)
                ]);

                const rawItems = (content.items || [])
                    .filter(it => it && typeof it.str === 'string' && it.str.length > 0)
                    .map(it => {
                        const tr = it.transform || [1, 0, 0, 1, 0, 0];
                        const h = Math.abs(it.height || Math.hypot(tr[2], tr[3]) || 11);
                        return {
                            str: it.str,
                            fontName: it.fontName || '',
                            x: tr[4],
                            y: tr[5],
                            width: Math.abs(it.width || 0),
                            height: h,
                            hasEOL: !!it.hasEOL
                        };
                    });

                // Gom các mảnh chữ theo dòng (trục Y giảm dần từ trên xuống dưới), rồi sắp xếp trái -> phải theo X
                const lines = [];
                for (const item of rawItems) {
                    const tol = Math.max(3.5, item.height * 0.45);
                    let targetLine = null;
                    for (let li = lines.length - 1; li >= 0; li--) {
                        if (Math.abs(lines[li].y - item.y) <= tol) {
                            targetLine = lines[li];
                            break;
                        }
                    }
                    if (!targetLine) {
                        targetLine = { y: item.y, items: [] };
                        lines.push(targetLine);
                    }
                    targetLine.items.push(item);
                }

                lines.sort((a, b) => b.y - a.y);

                const lineHtmls = lines.map(line => {
                    line.items.sort((a, b) => a.x - b.x);
                    let lineHtml = '';
                    let prevEndX = null;
                    for (const item of line.items) {
                        if (prevEndX !== null) {
                            const gap = item.x - prevEndX;
                            const spaceW = Math.max(2.5, item.height * 0.25);
                            if (gap > spaceW * 2.5) {
                                lineHtml += '   ';
                            } else if (gap > spaceW * 0.45 && !lineHtml.endsWith(' ')) {
                                lineHtml += ' ';
                            }
                        }
                        const formattedItem = formatPdfItemWithUnderlines(item, underlines);
                        const fontMeta = `${item.fontName || ''} ${(content.styles && content.styles[item.fontName] && content.styles[item.fontName].fontFamily) || ''}`;
                        const isBoldPdf = /bold|black|heavy|semibold|demi/i.test(fontMeta);
                        lineHtml += isBoldPdf ? `<strong>${formattedItem}</strong>` : formattedItem;
                        const w = item.width > 0 ? item.width : item.str.length * (item.height * 0.5);
                        prevEndX = item.x + w;
                    }
                    return `<p>${lineHtml}</p>`;
                });

                pagesHtml.push(lineHtmls.join('\n'));
            }

            return parseWordContentHTML(pagesHtml.join('\n'), '');
        }

        function parseUploadedExamHtml(source) {
            return parseWordContentHTML(source, '');

        function executeWordParser() {
            const pasteContainer = document.getElementById('raw-word-text');
            if (!pasteContainer) return;

            const htmlContent = pasteContainer.innerHTML;
            const rawText = pasteContainer.innerText || pasteContainer.textContent;

            if (!rawText.trim() && !htmlContent.trim()) {
                showToast('Vui lòng dán nội dung từ file Word vào ô bóc tách!', 'error');
                return;
            }

            const parsed = parseWordContentHTML(htmlContent, rawText);
            if (parsed.length === 0) {
                showToast('Không bóc tách được câu hỏi nào. Vui lòng kiểm tra định dạng!', 'error');
                return;
            }

            const detectedCount = parsed.filter(q => ['A', 'B', 'C', 'D'].includes(q.answer)).length;
            if (detectedCount > 0) {
                showToast(`Bóc tách thành công ${parsed.length} câu hỏi (nhận diện đáp án đúng ${detectedCount}/${parsed.length} câu)!`, 'success');
            } else {
                showToast(`Bóc tách thành công ${parsed.length} câu hỏi mới!`, 'success');
            }
        }

        function buildCleanIndexMap(markedStr) {
            const tokenRegex = /\[\[\/?(?:U|B)\]\]/g;
            let clean = '';
            const map = [];
            let lastIdx = 0;
            let m;
            while ((m = tokenRegex.exec(markedStr)) !== null) {
                for (let i = lastIdx; i < m.index; i++) {
                    map.push(i);
                    clean += markedStr[i];
                }
                lastIdx = m.index + m[0].length;
            }
            for (let i = lastIdx; i < markedStr.length; i++) {
                map.push(i);
                clean += markedStr[i];
            }
            map.push(markedStr.length);
            return { clean, map };
        }

        function extractStructuredTextWithUnderlineMarkers(htmlContent, fallbackText) {
            if (!htmlContent || !String(htmlContent).trim()) {
                return String(fallbackText || '').replace(/ /g, ' ');
            }

            const doc = new DOMParser().parseFromString(htmlContent, 'text/html');
            doc.querySelectorAll('script, style, noscript, iframe').forEach(el => el.remove());
            const blockTags = new Set([
                'P', 'DIV', 'LI', 'TR', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
                'SECTION', 'ARTICLE', 'BLOCKQUOTE', 'HEADER', 'FOOTER', 'PRE'
            ]);

            function getTextMarks(el) {
                if (!el || el.nodeType !== 1) return { underline: false, bold: false };
                const tag = el.tagName;
                const styleAttr = (el.getAttribute('style') || '').toLowerCase();
                const computedWeight = (el.getAttribute('data-font-weight') || '').toLowerCase();
                return {
                    underline: tag === 'U' || tag === 'INS' ||
                        /text-decoration(?:-line)?\s*:[^;]*underline/.test(styleAttr) ||
                        /border-bottom(?:-style)?\s*:[^;]*(?:solid|double|dotted|dashed)/.test(styleAttr),
                    bold: tag === 'B' || tag === 'STRONG' ||
                        /font-weight\s*:\s*(?:bold|[7-9]00)/.test(styleAttr) ||
                        /^(?:bold|[7-9]00)$/.test(computedWeight)
                };
            }

            let out = '';
            function walk(node, marks) {
                if (!node) return;
                if (node.nodeType === 3) {
                    const txt = (node.nodeValue || '').replace(/ /g, ' ');
                    if (!txt) return;
                    let value = txt;
                    if (marks.underline && txt.trim()) value = `[[U]]${value}[[/U]]`;
                    if (marks.bold && txt.trim()) value = `[[B]]${value}[[/B]]`;
                    out += value;
                    return;
                }
                if (node.nodeType !== 1) return;
                const tag = node.tagName;
                if (tag === 'BR') { out += '\n'; return; }

                const own = getTextMarks(node);
                const nextMarks = {
                    underline: marks.underline || own.underline,
                    bold: marks.bold || own.bold
                };
                const isBlock = blockTags.has(tag);
                if (isBlock && out && !out.endsWith('\n')) out += '\n';
                for (let child = node.firstChild; child; child = child.nextSibling) walk(child, nextMarks);
                if (tag === 'TD' || tag === 'TH') out += '\t';
                else if (isBlock && !out.endsWith('\n')) out += '\n';
            }

            walk(doc.body || doc.documentElement, { underline: false, bold: false });
            return out
                .replace(/\[\[\/U\]\](\s*)\[\[U\]\]/g, '$1')
                .replace(/\[\[\/B\]\](\s*)\[\[B\]\]/g, '$1')
                .replace(/[\t ]+\n/g, '\n')
                .replace(/\n[\t ]+/g, '\n')
                .replace(/\n{3,}/g, '\n\n');
        }

        // Tách các đáp án nằm trên cùng một hàng ngang (VD: "a. chào b. tạm biệt c. ăn cơm d. ngủ"
        // hoặc "A. chào   B. tạm biệt" / "C. ăn cơm   D. ngủ" / "Câu 1: hello là gì a. chào b. tạm biệt c. ăn cơm d. ngủ")
        function normalizeHorizontalQuestionText(textContent) {
            const seqOrder = { A: 0, B: 1, C: 2, D: 3 };
            return String(textContent || '').split(/\r?\n/).map(line => {
                const { clean, map } = buildCleanIndexMap(line);
                const markerRegex = /(^|[\s	])([A-Da-d])[\.\:\)]\s*/g;
                const markers = [];
                let match;
                while ((match = markerRegex.exec(clean)) !== null) {
                    const key = match[2].toUpperCase();
                    const startClean = match.index + match[1].length;
                    markers.push({ key, startClean });
                }

                if (markers.length < 2) return line;

                // Tìm chuỗi các nhãn đáp án tăng dần theo thứ tự A -> B -> C -> D trên cùng dòng
                let bestRun = null;
                for (let i = 0; i < markers.length; i++) {
                    const run = [markers[i]];
                    for (let j = i + 1; j < markers.length; j++) {
                        const prevOrd = seqOrder[run[run.length - 1].key];
                        const curOrd = seqOrder[markers[j].key];
                        if (curOrd === prevOrd + 1) {
                            run.push(markers[j]);
                        }
                    }
                    if (run.length >= 2 && (!bestRun || run.length > bestRun.length)) {
                        bestRun = run;
                    }
                }

                if (!bestRun) return line;

                const parts = [];
                const firstStartOrig = map[bestRun[0].startClean];
                const prefix = line.slice(0, firstStartOrig).trimEnd();
                if (prefix) parts.push(prefix);

                for (let j = 0; j < bestRun.length; j++) {
                    const segStartOrig = map[bestRun[j].startClean];
                    const segEndOrig = (j + 1 < bestRun.length) ? map[bestRun[j + 1].startClean] : line.length;
                    const seg = line.slice(segStartOrig, segEndOrig).trim();
                    if (seg) parts.push(seg);
                }

                return parts.join('\n');
            }).join('\n');
        }

        function stripUnderlineMarkers(str) {
            return String(str || '').replace(/\[\[\/?(?:U|B)\]\]/g, '');
        }

        function hasMeaningfulUnderline(markedSegment) {
            const uMatches = String(markedSegment || '').matchAll(/\[\[U\]\]([\s\S]*?)\[\[\/U\]\]/g);
            for (const m of uMatches) {
                const inner = m[1].trim();
                // Bỏ qua các dấu gạch dưới điền khuyết kiểu "_____" trong nội dung câu/đáp án
                if (inner.length > 0 && !/^_+$/.test(inner)) {
                    return true;
                }
            }
            return false;
        }

        function hasMeaningfulBold(markedSegment) {
            const matches = String(markedSegment || '').matchAll(/\[\[B\]\]([\s\S]*?)\[\[\/B\]\]/g);
            for (const m of matches) {
                if (m[1].trim().length > 0) return true;
            }
            return false;
        }

        function parseWordContentHTML(htmlContent, textContent) {
            const markedSource = extractStructuredTextWithUnderlineMarkers(htmlContent, textContent);
            const normalizedText = normalizeHorizontalQuestionText(markedSource);

            const { clean: cleanAll, map: mapAll } = buildCleanIndexMap(normalizedText);
            const qHeaderRegex = /(?:^|\n)\s*(?:Câu|Bài|Question)\s*\d+\s*[\:\.\)]/gi;
            const splitPoints = [];
            let qMatch;
            while ((qMatch = qHeaderRegex.exec(cleanAll)) !== null) {
                const offset = qMatch[0].startsWith('\n') ? qMatch.index + 1 : qMatch.index;
                splitPoints.push(mapAll[offset]);
            }

            const blocks = [];
            if (splitPoints.length > 0) {
                for (let i = 0; i < splitPoints.length; i++) {
                    const start = splitPoints[i];
                    const end = i + 1 < splitPoints.length ? splitPoints[i + 1] : normalizedText.length;
                    blocks.push(normalizedText.slice(start, end));
                }
            } else {
                // Hỗ trợ trường hợp đề chỉ có 1 câu không ghi "Câu 1:" hoặc đánh số "1. ..."
                const numSplit = normalizedText.split(/(?=(?:^|\n)\s*\d+\s*[\.\)]\s+)/g);
                blocks.push(...numSplit);
            }

            const result = [];

            blocks.forEach((blockMarked, idx) => {
                const trimmedMarked = blockMarked.trim();
                if (!trimmedMarked) return;

                let questionText = "";
                let options = { A: "", B: "", C: "", D: "" };
                let rawOptionSegments = { A: "", B: "", C: "", D: "" };
                let answer = "";
                let answerDetected = false;
                let explanation = "";
                let lastOptionKey = "";

                const lines = trimmedMarked.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                lines.forEach(lineMarked => {
                    const { clean: lineClean, map: lineMap } = buildCleanIndexMap(lineMarked);

                    if (/^(?:Câu|Bài|Question)\s*\d+\s*[\:\.\)]/i.test(lineClean)) {
                        const headerMatch = lineClean.match(/^(?:Câu|Bài|Question)\s*\d+\s*[\:\.\)]\s*/i);
                        const restMarked = lineMarked.slice(lineMap[headerMatch[0].length]);
                        questionText = stripUnderlineMarkers(restMarked).trim();
                        lastOptionKey = "";
                    }
                    else if (/^\d+\s*[\.\)]\s+/.test(lineClean) && !questionText && !lastOptionKey) {
                        const numMatch = lineClean.match(/^\d+\s*[\.\)]\s+/);
                        const restMarked = lineMarked.slice(lineMap[numMatch[0].length]);
                        questionText = stripUnderlineMarkers(restMarked).trim();
                    }
                    else if (/^[A-Da-d]\s*[\.\:\)]\s*/.test(lineClean)) {
                        const optMatches = [...lineClean.matchAll(/(?:^|[\s	])([A-Da-d])\s*[\.\:\)]\s*/g)];
                        if (optMatches.length > 0) {
                            for (let i = 0; i < optMatches.length; i++) {
                                const m = optMatches[i];
                                const optKey = m[1].toUpperCase();
                                const prefixSpaceLen = m[0].length - m[0].trimStart().length;
                                const fullSegStartOrig = lineMap[m.index + prefixSpaceLen];
                                const contentStartOrig = lineMap[m.index + m[0].length];
                                const segEndOrig = (i + 1 < optMatches.length)
                                    ? lineMap[optMatches[i + 1].index]
                                    : lineMarked.length;

                                const fullSegMarked = lineMarked.slice(fullSegStartOrig, segEndOrig).trim();
                                const contentMarked = lineMarked.slice(contentStartOrig, segEndOrig).trim();

                                options[optKey] = stripUnderlineMarkers(contentMarked).trim();
                                rawOptionSegments[optKey] = (rawOptionSegments[optKey] ? rawOptionSegments[optKey] + ' ' : '') + fullSegMarked;
                                lastOptionKey = optKey;
                            }
                        }
                    }
                    else if (/^(?:Đáp án|Đáp án đúng|Key|Ans)\s*[\:\.\s]/i.test(lineClean)) {
                        const keyMatch = lineClean.match(/^(?:Đáp án|Đáp án đúng|Key|Ans)\s*[\:\.\s]*([A-Da-d])/i);
                        if (keyMatch) {
                            answer = keyMatch[1].toUpperCase();
                            answerDetected = true;
                        }
                        lastOptionKey = "";
                    }
                    else if (/^(?:Lời giải|Giải thích|HDG)\s*[\:\.\s]/i.test(lineClean)) {
                        const expMatch = lineClean.match(/^(?:Lời giải|Giải thích|HDG)\s*[\:\.\s]*/i);
                        explanation = stripUnderlineMarkers(lineMarked.slice(lineMap[expMatch[0].length])).trim();
                        lastOptionKey = "";
                    }
                    else if (!options.A && !options.B && !options.C && !options.D) {
                        questionText += (questionText ? " " : "") + stripUnderlineMarkers(lineMarked).trim();
                    }
                    else if (explanation) {
                        explanation += " " + stripUnderlineMarkers(lineMarked).trim();
                    }
                    else if (lastOptionKey) {
                        options[lastOptionKey] += " " + stripUnderlineMarkers(lineMarked).trim();
                        rawOptionSegments[lastOptionKey] += " " + lineMarked.trim();
                    }
                });

                // Nhận diện đáp án đúng bằng gạch chân (gạch chân toàn bộ đáp án hoặc gạch chân chữ cái a/b/c/d đại diện)
                if (!answerDetected) {
                    const underlinedKeys = ['A', 'B', 'C', 'D'].filter(k => hasMeaningfulUnderline(rawOptionSegments[k]));
                    if (underlinedKeys.length === 1) {
                        answer = underlinedKeys[0];
                        answerDetected = true;
                    } else if (underlinedKeys.length > 1) {
                        // Nếu có nhiều hơn 1 lựa chọn có gạch chân (ví dụ đề tiếng Anh gạch chân từ cần tìm lỗi sai trong câu nhưng lan xuống),
                        // ưu tiên lựa chọn có gạch chân chữ cái đại diện (a/b/c/d) hoặc toàn bộ lựa chọn
                        const letterOrFullMatch = underlinedKeys.find(k => {
                            const seg = rawOptionSegments[k];
                            return /\[\[U\]\]\s*[A-Da-d]\s*[\.\:\)]?\s*\[\[\/U\]\]/.test(seg) ||
                                   /\[\[U\]\][\s\S]*\[\[\/U\]\]\s*$/.test(seg);
                        });
                        if (letterOrFullMatch) {
                            answer = letterOrFullMatch;
                            answerDetected = true;
                        }
                    }
                }

                // Nhận diện bôi đậm: chấp nhận bôi đậm chữ cái A/B/C/D hoặc toàn bộ nội dung lựa chọn.
                // Chỉ tự chọn khi có đúng một phương án được đánh dấu để tránh đoán sai.
                if (!answerDetected) {
                    const boldKeys = ['A', 'B', 'C', 'D'].filter(k => hasMeaningfulBold(rawOptionSegments[k]));
                    if (boldKeys.length === 1) {
                        answer = boldKeys[0];
                        answerDetected = true;
                    } else if (boldKeys.length > 1) {
                        const letterOrFullMatch = boldKeys.find(k => {
                            const seg = rawOptionSegments[k];
                            return /\[\[B\]\]\s*[A-Da-d]\s*[\.\:\)]?\s*\[\[\/B\]\]/.test(seg) ||
                                   /^\s*[A-Da-d]\s*[\.\:\)]?\s*\[\[B\]\][\s\S]*\[\[\/B\]\]\s*$/.test(seg);
                        });
                        if (letterOrFullMatch) {
                            answer = letterOrFullMatch;
                            answerDetected = true;
                        }
                    }
                }

                if (questionText.trim() && (options.A || options.B || options.C || options.D)) {
                    result.push({
                        id: 'parsed_' + Date.now() + '_' + idx,
                        text: questionText.trim(),
                        options: options,
                        answer: answer,
                        explanation: explanation.trim()
                    });
                }
            });

            return result;
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        async function saveEditorQuizSubmit() {
            const title = document.getElementById('ed-title').value.trim();
            const categoryId = document.getElementById('ed-category').value;
            const subject = document.getElementById('ed-subject').value.trim();
            const duration = parseInt(document.getElementById('ed-duration').value) || 15;

            if (!title) {
                showToast('Vui lòng nhập tên bài kiểm tra!', 'error');
                return;
            }

            if (state.editorQuiz.questions.length === 0) {
                showToast('Bài kiểm tra cần có ít nhất 1 câu hỏi!', 'error');
                return;
            }

            const unanswered = state.editorQuiz.questions.filter(q => !['A', 'B', 'C', 'D'].includes(String(q.answer || '').toUpperCase()));
            if (unanswered.length > 0) {
                showToast('Còn ' + unanswered.length + ' câu chưa chọn đáp án đúng. Vui lòng kiểm tra trước khi lưu!', 'error');
                return;
            }

            state.editorQuiz.title = title;
            state.editorQuiz.categoryId = categoryId;
            state.editorQuiz.subject = subject;
            state.editorQuiz.duration = duration;
            state.editorQuiz.shuffleQuestions = !!document.getElementById('ed-shuffle-questions')?.checked;
            state.editorQuiz.shuffleOptions = !!document.getElementById('ed-shuffle-options')?.checked;

            const existingIdx = state.quizzes.findIndex(q => q.id === state.editorQuiz.id);
            if (existingIdx >= 0) {
                state.quizzes[existingIdx] = state.editorQuiz;
            } else {
                state.quizzes.push(state.editorQuiz);
            }

            saveQuizzes();
            try {
                await syncTeacherQuizToCloud(state.editorQuiz);
                showToast('Đã lưu bài kiểm tra và đồng bộ lên Firebase. Học sinh trong lớp sẽ thấy bài khi đăng nhập.', 'success');
            } catch (err) {
                console.error('Quiz cloud sync failed:', err);
                showToast('Đề đã lưu trên thiết bị này nhưng chưa đồng bộ cloud: ' + (err.message || 'lỗi Firestore'), 'error');
            }

            const cat = state.categories.find(c => c.id === categoryId);
            if (cat) state.selectedClassCategory = cat;
            navigateView('teacher_class_quizzes');
        }

            const quiz = state.quizzes.find(q => q.id === state.activeQuizId);

                navigateView('teacher_categories');
                return;
            }

            const attempts = state.submissions.filter(s => s.quizId === quiz.id);
            attempts.sort((a, b) => b.score - a.score || a.timeTakenSec - b.timeTakenSec);

            const count = attempts.length;
            const maxScore = count > 0 ? Math.max(...attempts.map(s => s.score)).toFixed(1) : '0.0';
            const avgScore = count > 0 ? (attempts.reduce((acc, s) => acc + s.score, 0) / count).toFixed(1) : '0.0';

            const rowsHtml = count === 0 ? `
                <tr><td colspan="6" class="py-8 text-center text-slate-400">Chưa có học sinh nào nộp bài kiểm tra này.</td></tr>

                if (rankIdx === 1) badge = `<span class="text-2xl">🥈</span>`;
                if (rankIdx === 2) badge = `<span class="text-2xl">🥉</span>`;

        (function watchModalScrollLock() {
            const el = document.getElementById('modal-container');
            if (!el || !window.MutationObserver) return;
            new MutationObserver(() => {
                document.documentElement.classList.toggle('modal-open', !el.classList.contains('hidden'));
            }).observe(el, { attributes: true, attributeFilter: ['class'] });
        })();

        function closeModal(fromPopState = false) {
            const container = document.getElementById('modal-container');
            if (container) container.classList.add('hidden');
            if (!fromPopState && _hasModalHistoryEntry) {
                _hasModalHistoryEntry = false;
                _ignoringNextPop = true;
                try {
                    window.history.back();
                } catch (e) {
                    _ignoringNextPop = false;
                }
            } else {
                _hasModalHistoryEntry = false;
            }
        }

        // HANDLERS FOR CATEGORY MODAL ACTIONS
        async function handleConfirmAddCategory(e) {
            if (e) e.preventDefault();
            const name = (document.getElementById('cat-name-input')?.value || '').trim();
            if (!name) { showToast('Vui lòng nhập tên lớp!', 'error'); return; }
            if (state.role !== 'teacher' || !state.currentUser?.uid || !firebaseAuth.currentUser) { showToast('Chỉ giáo viên đã đăng nhập mới tạo lớp được.', 'error'); return; }
            const newCat = { id: 'cat_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), name, icon: 'fa-folder', ownerUid: state.currentUser.uid, createdBy: state.currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
            try {
                await firestoreDb.collection('categories').doc(newCat.id).set(newCat);
                newCat.createdAt = new Date().toISOString();
                state.categories.push(newCat); saveCategories(); closeModal();
                showToast(`Đã tạo lớp "${name}" và lưu lên Firebase!`, 'success');
                renderTeacherCategoriesView(document.getElementById('app-container'));
            } catch (err) { console.error(err); showToast('Không thể tạo lớp: ' + (err.message || 'lỗi Firestore'), 'error'); }
        }

        async function handleConfirmEditCategory(e, catId) {
            if (e) e.preventDefault();
            const name = (document.getElementById('cat-edit-name-input')?.value || '').trim();
            if (!name) { showToast('Vui lòng nhập tên lớp mới!', 'error'); return; }
            const cat = state.categories.find(c => c.id === catId);
            if (!cat || cat.ownerUid !== state.currentUser?.uid) { showToast('Mày chỉ được sửa lớp do mình tạo.', 'error'); return; }
            try {
                await firestoreDb.collection('categories').doc(catId).update({ name, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                cat.name = name; saveCategories(); closeModal(); showToast('Đã cập nhật lớp trên Firebase!', 'success');
                renderTeacherCategoriesView(document.getElementById('app-container'));
            } catch (err) { console.error(err); showToast('Không thể sửa lớp: ' + (err.message || 'lỗi Firestore'), 'error'); }
        }

        async function handleConfirmDeleteCategory(catId) {
            const cat = state.categories.find(c => c.id === catId);
            if (!cat || cat.ownerUid !== state.currentUser?.uid) { showToast('Mày chỉ được xóa lớp do mình tạo.', 'error'); return; }
            try {
                const students = state.users.filter(u => u.classId === catId);
                if (students.length) { showToast('Lớp còn học sinh. Hãy chuyển học sinh sang lớp khác trước khi xóa.', 'error'); return; }
                await firestoreDb.collection('categories').doc(catId).delete();
                state.categories = state.categories.filter(c => c.id !== catId);
                saveCategories(); closeModal(); showToast('Đã xóa lớp trên Firebase!', 'success');
                renderTeacherCategoriesView(document.getElementById('app-container'));
            } catch (err) { console.error(err); showToast('Không thể xóa lớp: ' + (err.message || 'lỗi Firestore'), 'error'); }
        }

        async function handleConfirmDeleteQuiz(quizId) {
            const quiz = state.quizzes.find(q => q.id === quizId);
            if (quiz?.teacherUid && quiz.teacherUid !== state.currentUser?.uid) {
                showToast('Mày chỉ được xóa bài kiểm tra do mình tạo.', 'error'); return;
            }
            try {
                if (quiz?.teacherUid === state.currentUser?.uid) await deleteTeacherQuizFromCloud(quizId);
                state.quizzes = state.quizzes.filter(q => q.id !== quizId);
                saveQuizzes();
                closeModal();
                showToast('Đã xóa bài kiểm tra khỏi danh sách và Firebase (nếu có).', 'success');
                renderTeacherClassQuizzesView(document.getElementById('app-container'));
            } catch (err) {
                console.error('Quiz cloud delete failed:', err);
                showToast('Không thể xóa bài trên Firebase: ' + (err.message || 'lỗi Firestore'), 'error');
            }
        }

        function handleConfirmResetDemo() {
            state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
            state.quizzes = JSON.parse(JSON.stringify(DEFAULT_QUIZZES));
            saveCategories();
            saveQuizzes();
            closeModal();
            showToast('Đã khôi phục Thư mục và Đề thi mẫu (giữ nguyên các tài khoản)!', 'success');
            renderCurrentView();
        }

        // ================= 9. TOAST NOTIFICATIONS =================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');

            let bg = "bg-slate-900 text-white";
            if (type === 'success') bg = "bg-emerald-600 text-white";
            if (type === 'error') bg = "bg-rose-600 text-white";
            if (type === 'info') bg = "bg-brand-600 text-white";

            toast.className = `px-5 py-3 rounded-2xl shadow-xl ${bg} text-sm font-semibold pointer-events-auto flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0`;
            toast.innerHTML = `<span>${escapeHtml(msg)}</span>`;

            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
