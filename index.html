        const PersistStore = {
            db: null,
            dbName: 'EduQuizProBackupDB',
            storeName: 'kv',

            initDB: function() {
                return new Promise((resolve) => {
                    if (!window.indexedDB) return resolve(null);
                    let settled = false;
                    const timer = setTimeout(() => {
                        if (!settled) { settled = true; resolve(null); }
                    }, 500);

                    try {
                        const req = indexedDB.open(this.dbName, 1);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(this.storeName)) {
                                db.createObjectStore(this.storeName);
                            }
                        };
                        req.onsuccess = (e) => {
                            if (settled) return;
                            settled = true;
                            clearTimeout(timer);
                            this.db = e.target.result;
                            resolve(this.db);
                        };
                        req.onerror = () => {
                            if (settled) return;
                            settled = true;
                            clearTimeout(timer);
                            resolve(null);
                        };
                    } catch (err) {
                        if (!settled) { settled = true; clearTimeout(timer); resolve(null); }
                    }
                });
            },

            idbGet: function(key) {
                return new Promise((resolve) => {
                    if (!this.db) return resolve(null);
                    try {
                        const tx = this.db.transaction(this.storeName, 'readonly');
                        const store = tx.objectStore(this.storeName);
                        const req = store.get(key);
                        req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
                        req.onerror = () => resolve(null);
                    } catch (e) { resolve(null); }
                });
            },

            idbSet: function(key, val) {
                if (!this.db) return;
                try {
                    const tx = this.db.transaction(this.storeName, 'readwrite');
                    tx.objectStore(this.storeName).put(val, key);
                } catch (e) {}
            },

            idbRemove: function(key) {
                if (!this.db) return;
                try {
                    const tx = this.db.transaction(this.storeName, 'readwrite');
                    tx.objectStore(this.storeName).delete(key);
                } catch (e) {}
            },

            async hydrateFromBackup() {
                await this.initDB();
                if (navigator.storage && navigator.storage.persist) {
                    navigator.storage.persist().catch(() => {});
                }
                const keys = Object.values(STORAGE_KEYS);
                for (const key of keys) {
                    let lsVal = null;
                    try { lsVal = localStorage.getItem(key); } catch (e) {}
                    if (lsVal === null) {
                        const backupVal = await this.idbGet(key);
                        if (backupVal !== null) {
                            try { localStorage.setItem(key, backupVal); } catch (e) {}
                        }
                    } else {
                        this.idbSet(key, lsVal);
                    }
                }
            },

            setItem(key, valueObj) {
                const str = JSON.stringify(valueObj);
                try { localStorage.setItem(key, str); } catch (e) {}
                this.idbSet(key, str);
            },

            getItem(key, fallback = null) {
                try {
                    const raw = localStorage.getItem(key);
                    if (raw === null) return fallback;
                    return JSON.parse(raw);
                } catch (e) {
                    return fallback;
                }
            },

            removeItem(key) {
                try { localStorage.removeItem(key); } catch (e) {}
                try { sessionStorage.removeItem(key); } catch (e) {}
                this.idbRemove(key);
            }
        };

        function buildHistoryHash() {

        function buildHistoryState(idxOverride = null) {

            return {

                index: idx,

        function pushAppHistory(replace = false) {
            if (!window.history || !window.history.pushState) return;
            try {
                if (replace) {
                    window.history.replaceState(buildHistoryState(_historyIndex), '', buildHistoryHash());
                } else {
                    _historyIndex += 1;
                    window.history.pushState(buildHistoryState(_historyIndex), '', buildHistoryHash());
                }
            } catch (e) {}
        }

        function initHistoryStack() {
            if (!window.history || !window.history.replaceState) return;
            try {
                // Nếu đang khôi phục vào giữa bài thi hoặc trang con, tạo tầng gốc an toàn phía trước
                if (state.currentView === 'quiz_taking' && state.activeQuizId) {
                    _historyIndex = 0;
                    window.history.replaceState({

                    }, '', '#quiz_preview');
                    _historyIndex = 1;

                // Tạo một điểm neo gốc (root guard) để Android / trình duyệt không thoát đột ngột ngay lần bấm Back đầu tiên ở màn hình chính
                _historyIndex = 0;
                window.history.replaceState({
                    __app: APP_HISTORY_PREFIX,
                    index: 0,
                    isRootGuard: true,
                    view: state.currentView,
                    authGateStep: state.authGateStep,
                    studentAuthTab: state.studentAuthTab,

                    activeSubmissionId: state.activeSubmission ? state.activeSubmission.id : null

                _historyIndex = 1;

            } catch (e) {}
        }

            const prevQuizId = state.activeQuizId;
            const prevSubId = state.activeSubmission ? state.activeSubmission.id : null;
            const prevCatId = state.selectedClassCategory ? state.selectedClassCategory.id : null;

            if (params.activeQuizId !== undefined) state.activeQuizId = params.activeQuizId;
            if (params.selectedClassCategory !== undefined) state.selectedClassCategory = params.selectedClassCategory;

            state.currentView = viewName;
            renderAppHeader();

            try {
                renderCurrentView();
            } catch (err) {
                console.error("View Render Error:", err);
                renderSafetyErrorCard(err);
            }

            const nextSubId = state.activeSubmission ? state.activeSubmission.id : null;
            const nextCatId = state.selectedClassCategory ? state.selectedClassCategory.id : null;
            const isSameRoute = (
                prevView === state.currentView &&
                prevQuizId === state.activeQuizId &&
                prevSubId === nextSubId &&
                prevCatId === nextCatId
            );

            if (!skipHistory) {
                // Sau khi nộp bài, thay thế trạng thái quiz_taking trong history để bấm Back quay thẳng về trang chi tiết đề (quiz_preview)
                if (prevView === 'quiz_taking' && state.currentView === 'quiz_result') {
                    pushAppHistory(true);
                } else if (!isSameRoute) {
                    pushAppHistory(false);
                }
            }

            if (params && params.restoreScroll) {
                restoreScrollPosition(false);
            } else {
                restoreScrollPosition(true);
            }
        }

        // Hàm điều hướng quay lại thống nhất cho tất cả nút "Quay lại" trong giao diện
        function goBackOrNavigate(fallbackView) {
            if (window.history && window.history.length > 1 && _historyIndex > 1) {
                window.history.back();
            } else {
                navigateView(fallbackView);
            }
        }

        function handleBrandLogoClick() {
            if (!state.currentUser) {
                navigateView('auth_gate');

                navigateView('teacher_categories');
            } else {
                navigateView('student_home');
            }
        }

        function renderCurrentView() {
            const container = document.getElementById('app-container');
            if (!container) return;

            if (state.currentView !== 'auth_gate' && !state.currentUser) {
                state.currentView = 'auth_gate';
                renderAppHeader();
            }

            switch(state.currentView) {
                case 'auth_gate':
                    renderAuthGateView(container);
                    break;
                case 'admin_dashboard':
                    renderAdminDashboardView(container);
                    break;
                case 'student_home':
                    renderStudentHomeView(container);
                    break;
                case 'quiz_preview':
                    renderQuizPreviewView(container);
                    break;
                case 'quiz_taking':
                    renderQuizTakingView(container);
                    break;
                case 'quiz_result':
                    renderQuizResultView(container);
                    break;
                case 'student_history':
                    renderStudentHistoryView(container);
                    break;
                case 'teacher_categories':
                    renderTeacherCategoriesView(container);
                    break;
                case 'teacher_class_quizzes':

                    break;
                case 'teacher_editor':

            } else {
                input.type = 'password';
                if (icon) icon.className = 'fa-regular fa-eye';
            }
        }

        // ================= ADMIN DATABASE INITIALIZATION =================
        // Idempotent, admin-only migration of non-secret local data.
        function dbSafeId(value, fallback) {
            const raw = String(value || fallback || 'item');
            return raw.replace(/[\/\?#\[\]\.]/g, '_').slice(0, 120) || fallback || 'item';
        }

        function removeSensitiveFields(value) {
            if (Array.isArray(value)) return value.map(removeSensitiveFields);
            if (!value || typeof value !== 'object') return value;
            const out = {};
            for (const [key, val] of Object.entries(value)) {
                if (/password|passwd|secret|token|credential|auth/i.test(key)) continue;
                out[key] = removeSensitiveFields(val);
            }
            return out;
        }

        async function initializeEduQuizDatabase() {
            const status = document.getElementById('admin-db-status');
            const button = document.getElementById('admin-db-init-btn');
            if (!state.currentUser || state.role !== 'admin' || !firebaseAuth.currentUser) {
                if (status) status.textContent = 'Phiên Admin không hợp lệ. Hãy đăng xuất và đăng nhập lại.';
                return;
            }
            if (!confirm('Tiến hành tạo cấu trúc Firestore và chuyển danh mục, đề thi, bài nộp từ trình duyệt này lên cloud? Dữ liệu đã có trên cloud sẽ không bị ghi đè.')) return;
            if (button) { button.disabled = true; button.textContent = 'Đang khởi tạo…'; }
            if (status) status.textContent = 'Đang kiểm tra quyền Admin và dữ liệu hiện có…';
            try {
                const uid = firebaseAuth.currentUser.uid;
                const profileSnap = await firestoreDb.collection('users').doc(uid).get();
                const profile = profileSnap.exists ? profileSnap.data() : null;
                if (!profile || profile.role !== 'admin' || profile.status !== 'active') throw new Error('Không xác minh được quyền Admin.');

                const schemaRef = firestoreDb.collection('_system').doc('schema');
                const schemaSnap = await schemaRef.get();
                const now = firebase.firestore.FieldValue.serverTimestamp();
                const collections = [
                    { name: 'categories', items: state.categories || [] },
                    { name: 'quizzes', items: state.quizzes || [] },
                    { name: 'submissions', items: state.submissions || [] }
                ];
                let created = 0, skipped = 0, questionCount = 0, answerCount = 0;
                let batch = firestoreDb.batch();
                let ops = 0;
                const commitIfNeeded = async (force=false) => {
                    if (ops >= 400 || (force && ops > 0)) { await batch.commit(); batch = firestoreDb.batch(); ops = 0; }
                };
                const queueCreate = async (ref, data) => {
                    const existing = await ref.get();
                    if (existing.exists) { skipped++; return false; }
                    const clean = removeSensitiveFields(data);
                    const bytes = new Blob([JSON.stringify(clean)]).size;
                    if (bytes > 850000) throw new Error('Một tài liệu quá lớn để lưu an toàn trong Firestore: ' + ref.path);
                    batch.set(ref, { ...clean, _migratedAt: now, _migratedBy: uid });
                    ops++; created++;
                    if (ops >= 400) await commitIfNeeded();
                    return true;
                };

                for (const category of collections[0].items) {
                    const id = dbSafeId(category.id, 'category_' + created);
                    await queueCreate(firestoreDb.collection('categories').doc(id), category);
                }
                for (const quiz of collections[1].items) {
                    const quizId = dbSafeId(quiz.id, 'quiz_' + created);
                    const questions = Array.isArray(quiz.questions) ? quiz.questions : [];
                    const quizMeta = { ...quiz };
                    delete quizMeta.questions;
                    await queueCreate(firestoreDb.collection('quizzes').doc(quizId), quizMeta);
                    for (let i = 0; i < questions.length; i++) {
                        const q = questions[i] || {};
                        const qId = dbSafeId(q.id, 'q_' + (i + 1));
                        const publicQuestion = { ...q };
                        delete publicQuestion.answer;
                        delete publicQuestion.correctAnswer;
                        delete publicQuestion.explanation;
                        await queueCreate(firestoreDb.collection('quizzes').doc(quizId).collection('questions').doc(qId), { ...publicQuestion, order: i + 1 });
                        const key = {};
                        if (q.answer !== undefined) key.answer = q.answer;
                        if (q.correctAnswer !== undefined) key.correctAnswer = q.correctAnswer;
                        if (q.explanation !== undefined) key.explanation = q.explanation;
                        if (Object.keys(key).length) {
                            await queueCreate(firestoreDb.collection('answer_keys').doc(quizId).collection('items').doc(qId), key);
                            answerCount++;
                        }
                        questionCount++;
                    }
                }
                for (const submission of collections[2].items) {
                    const id = dbSafeId(submission.id, 'submission_' + created);
                    await queueCreate(firestoreDb.collection('submissions').doc(id), submission);
                }
                await commitIfNeeded(true);
                if (!schemaSnap.exists) {
                    await schemaRef.set({ app: 'EduQuiz Pro', schemaVersion: 1, initializedAt: now, initializedBy: uid, collections: ['users', 'categories', 'classes', 'quizzes', 'answer_keys', 'submissions', 'classMaterials'] }, { merge: false });
                }
                if (status) status.textContent = `Hoàn tất. Đã tạo ${created} tài liệu; bỏ qua ${skipped} tài liệu đã tồn tại; xử lý ${questionCount} câu hỏi và tách ${answerCount} mục đáp án. Tài khoản và tài liệu đính kèm chưa được chuyển.`;
                showToast('Đã khởi tạo cấu trúc và đồng bộ dữ liệu an toàn lên Firestore.', 'success');
            } catch (err) {
                console.error('Database initialization failed:', err);
                if (status) status.textContent = 'Chưa hoàn tất: ' + (err.message || 'Lỗi không xác định') + '. Dữ liệu cũ trên thiết bị vẫn được giữ nguyên.';
                showToast('Khởi tạo database chưa hoàn tất.', 'error');
            } finally {
                if (button) { button.disabled = false; button.textContent = 'Khởi tạo / đồng bộ dữ liệu lên Firestore'; }
            }
        }

        // Firebase account provisioning: use a secondary Auth instance so creating a user never signs out the Admin.
        function eduQuizInternalEmail(username) {
            return String(username || '').trim().toLowerCase() + '@accounts.eduquiz.local';
        }

        async function createFirebaseManagedAccount(e) {
            if (e) e.preventDefault();
            if (state.role !== 'admin' || !firebaseAuth.currentUser || !state.currentUser?.uid) {
                showToast('Chỉ Admin đang đăng nhập mới được cấp tài khoản.', 'error');
                return;
            }
            const role = document.getElementById('managed-account-role')?.value;
            const name = (document.getElementById('managed-account-name')?.value || '').trim();
            const username = (document.getElementById('managed-account-username')?.value || '').trim().toLowerCase();
            const password = document.getElementById('managed-account-password')?.value || '';
            const button = document.getElementById('managed-account-submit');
            const status = document.getElementById('managed-account-status');
            if (role !== 'teacher' || !name || !/^[a-z0-9._-]{3,30}$/.test(username) || password.length < 6) {
                if (status) status.textContent = 'Kiểm tra lại thông tin: username 3–30 ký tự a-z, 0-9, dấu chấm, gạch dưới hoặc gạch ngang; mật khẩu tối thiểu 6 ký tự.';
                return;
            }
            if (button) { button.disabled = true; button.textContent = 'Đang tạo tài khoản…'; }
            if (status) status.textContent = 'Đang kiểm tra tên đăng nhập…';
            let secondaryApp = null;
            let secondaryUser = null;
            try {
                const adminUid = firebaseAuth.currentUser.uid;
                const adminProfileSnap = await firestoreDb.collection('users').doc(adminUid).get();
                const adminProfile = adminProfileSnap.exists ? adminProfileSnap.data() : null;
                if (!adminProfile || adminProfile.role !== 'admin' || adminProfile.status !== 'active') throw new Error('Không xác minh được quyền Admin.');
                const duplicate = await firestoreDb.collection('users').where('username', '==', username).limit(1).get();
                if (!duplicate.empty) throw new Error('Tên đăng nhập đã tồn tại. Hãy chọn tên khác.');
                const email = eduQuizInternalEmail(username);
                secondaryApp = firebase.apps.find(app => app.name === 'EduQuizAccountProvisioner') || firebase.initializeApp(firebaseConfig, 'EduQuizAccountProvisioner');
                const secondaryAuth = secondaryApp.auth();
                const credential = await secondaryAuth.createUserWithEmailAndPassword(email, password);
                secondaryUser = credential.user;
                const uid = secondaryUser.uid;
                await firestoreDb.collection('users').doc(uid).set({
                    uid, username, name, role, status: 'active',
                    authProvider: 'password', createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdBy: adminUid
                });
                await secondaryAuth.signOut();
                if (status) status.textContent = `Đã tạo tài khoản ${username} (${role === 'teacher' ? 'Giáo viên' : 'Học sinh'}). Có thể đăng nhập trên thiết bị khác.`;
                document.getElementById('admin-create-account-form')?.reset();
                showToast('Đã tạo tài khoản Firebase thành công.', 'success');
            } catch (err) {
                console.error('Create managed account failed:', err);
                if (secondaryUser) { try { await secondaryUser.delete(); } catch (cleanupErr) { console.warn('Không thể dọn tài khoản Auth chưa hoàn tất:', cleanupErr); } }
                const message = err.code === 'auth/email-already-in-use' ? 'Tên đăng nhập đã được sử dụng trong Firebase.' : (err.message || 'Không thể tạo tài khoản.');
                if (status) status.textContent = message;
                showToast(message, 'error');
            } finally {
                if (button) { button.disabled = false; button.textContent = 'Tạo tài khoản trên Firebase'; }
            }
        }

        async function handleStudentLoginSubmit(e) {
            if (e) e.preventDefault();
            const usernameEl = document.getElementById('field-username');
            const passwordEl = document.getElementById('field-password');

            const username = usernameEl.value.trim().toLowerCase();
            const password = passwordEl.value;
            state.authDraft.studentLoginUser = username;

            if (!username || !password) { state.authErrorMsg = 'Vui lòng nhập đầy đủ tên tài khoản và mật khẩu!'; renderCurrentView(); return; }
            try {
                const credential = await firebaseAuth.signInWithEmailAndPassword(eduQuizInternalEmail(username), password);
                const snap = await firestoreDb.collection('users').doc(credential.user.uid).get();
                const profile = snap.exists ? snap.data() : null;
                if (!profile || profile.role !== 'student' || profile.status !== 'active') {
                    await firebaseAuth.signOut();
                    throw new Error('Tài khoản không tồn tại, không phải học sinh hoặc đã bị khóa.');
                }
                state.authErrorMsg = ''; state.role = 'student'; state.isTeacherAuthenticated = false;
                state.currentUser = { uid: credential.user.uid, username: profile.username || username, name: profile.name || username, role: 'student', classId: profile.classId || null };
                // Tải lớp được phân công từ Firestore: máy mới không có danh mục lưu trong localStorage.
                if (profile.classId) {
                    const classSnap = await firestoreDb.collection('categories').doc(profile.classId).get();
                    if (classSnap.exists) {
                        const cloudClass = { id: classSnap.id, ...classSnap.data() };
                        const existingIndex = state.categories.findIndex(c => c.id === cloudClass.id);
                        if (existingIndex >= 0) state.categories[existingIndex] = { ...state.categories[existingIndex], ...cloudClass };
                        else state.categories.push(cloudClass);
                        saveCategories();
                    }
                }
                await loadStudentCloudData(state.currentUser);
                state.authDraft.studentLoginUser = username; saveAuthDraft(); saveActiveSession();
                showToast(`Chào mừng ${state.currentUser.name} đã đăng nhập!`, 'success');
                navigateView('student_home');
            } catch (err) {
                console.warn('Firebase student login failed:', err);
                const legacy = state.users.find(u => (u.username || '').toLowerCase() === username && u.password === password);
                if (legacy && err.code !== 'auth/wrong-password' && err.code !== 'auth/invalid-credential') {

                }
                renderCurrentView();
            }
        }

        function handleChangeTeacherPassword(e) {
            if (e) e.preventDefault();
            const curEl = document.getElementById('tp-current');
            const newEl = document.getElementById('tp-new');
            if (!curEl || !newEl) return;

            const currentPwd = curEl.value;
            const newPwd = newEl.value.trim();

            if (!newPwd) {
                showToast('Mật khẩu mới không được để trống!', 'error');
                return;
            }

            const idx = state.teacherAccounts.findIndex(
                t => t.username.toLowerCase() === (state.currentUser?.username || 'giaovien').toLowerCase()
            );
            if (idx < 0 || state.teacherAccounts[idx].password !== currentPwd) {
                showToast('Mật khẩu hiện tại chưa đúng!', 'error');

        // Option 1: quiz content (including answer fields) is delivered to the student browser.
        // This is suitable for practice/ordinary class tests, not confidential high-stakes exams.
        function mergeCloudRecords(localItems, cloudItems) {
            const map = new Map((localItems || []).map(item => [item.id, item]));
            (cloudItems || []).forEach(item => map.set(item.id, { ...map.get(item.id), ...item }));
            return Array.from(map.values());
        }

        async function loadStudentCloudData(profile = state.currentUser) {
            if (state.role !== 'student' || !profile?.uid || !firebaseAuth.currentUser) return;
            const classId = profile.classId || state.currentUser?.classId;
            if (!classId) return;
            const [quizSnap, submissionSnap] = await Promise.all([
                firestoreDb.collection('quizzes').where('categoryId', '==', classId).get(),
                firestoreDb.collection('submissions').where('studentUid', '==', profile.uid).get()
            ]);
            const cloudQuizzes = quizSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .filter(q => q.teacherUid && Array.isArray(q.questions));
            const cloudSubmissions = submissionSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            // Replace cached quizzes for this class so a quiz deleted by the teacher
            // does not remain visible on a student's other device.
            state.quizzes = [
                ...(state.quizzes || []).filter(q => q.categoryId !== classId),
                ...cloudQuizzes
            ];
            state.submissions = mergeCloudRecords(state.submissions, cloudSubmissions);
            saveQuizzes(); saveSubmissions();
        }

        async function syncTeacherQuizToCloud(quiz) {
            if (state.role !== 'teacher' || !state.currentUser?.uid || !firebaseAuth.currentUser) {
                throw new Error('Phiên giáo viên chưa xác thực với Firebase.');
            }
            const ownedClass = state.categories.find(c => c.id === quiz.categoryId && c.ownerUid === state.currentUser.uid);
            if (!ownedClass) throw new Error('Chỉ được giao bài trong lớp do chính giáo viên này tạo.');
            // Keep local state aware that this quiz is now owned/synced by this teacher.
            quiz.teacherUid = state.currentUser.uid;
            quiz.ownerUid = state.currentUser.uid;
            const payload = {
                ...quiz,
                id: quiz.id,
                categoryId: ownedClass.id,
                teacherUid: state.currentUser.uid,
                ownerUid: state.currentUser.uid,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await firestoreDb.collection('quizzes').doc(String(quiz.id)).set(payload, { merge: true });
        }

        function shuffleArray(items) {
            const arr = items.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function createQuizVariant(quiz, shuffleQuestions = true, shuffleOptions = true) {
            const source = (quiz.questions || []).map(q => JSON.parse(JSON.stringify(q)));
            const ordered = shuffleQuestions ? shuffleArray(source) : source;
            return ordered.map(q => {
                if (!shuffleOptions || !q.options) return q;
                const oldKeys = Object.keys(q.options).filter(k => q.options[k] !== undefined && q.options[k] !== null && String(q.options[k]).trim() !== '');
                const shuffledKeys = shuffleArray(oldKeys);
                const labels = ['A', 'B', 'C', 'D'];
                const newOptions = {};
                let newAnswer = String(q.answer || '').toUpperCase();
                shuffledKeys.forEach((oldKey, idx) => {
                    const newKey = labels[idx] || oldKey;
                    newOptions[newKey] = q.options[oldKey];
                    if (oldKey.toUpperCase() === String(q.answer || '').toUpperCase()) newAnswer = newKey;
                });
                q.options = newOptions;
                q.answer = newAnswer;
                return q;
            });
        }

                        <!-- Grid Info -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-brand-100 text-brand-600 flex items-center justify-center font-bold text-lg">
                                    <i class="fa-solid fa-list-check"></i>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-400 font-semibold block">Số câu hỏi</span>
                                    <strong class="text-slate-900 text-base">${quiz.questions ? quiz.questions.length : 0} câu</strong>
                                </div>
                            </div>

                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-lg">
                                    <i class="fa-regular fa-clock"></i>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-400 font-semibold block">Thời gian</span>
                                    <strong class="text-slate-900 text-base">${quiz.duration} phút</strong>
                                </div>
                            </div>

                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center font-bold text-lg">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-400 font-semibold block">Số lần làm</span>
                                    <strong class="text-slate-900 text-base">${attempts.length} lần</strong>
                                </div>
                            </div>

                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-lg">
                                    <i class="fa-solid fa-trophy"></i>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-400 font-semibold block">Điểm cao nhất</span>
                                    <strong class="text-slate-900 text-base">${bestScore} / 10</strong>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Attempts History Card -->
                    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                            <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2">
                                <i class="fa-solid fa-clock-rotate-left text-brand-600"></i>
                                Lịch Sử Làm Bài Của Bạn
                            </h3>
                            <span class="text-xs font-semibold px-3 py-1 bg-slate-100 text-slate-600 rounded-full">${escapeHtml(state.currentUser?.username || state.currentUser?.name)}</span>
                        </div>
                        ${historyTableHtml}
                    </div>
                </div>
            `;
        }

        // ---- Đồng hồ dựa trên mốc thời gian thật: vẫn đúng khi khóa màn hình / chuyển app trên iOS & Android ----
        function getQuizRemainingSeconds() {
            if (!state.quizEndAt) return state.secondsLeft;
            return Math.max(0, Math.ceil((state.quizEndAt - Date.now()) / 1000));
        }

        function formatTimerText(total) {
            const m = Math.floor(total / 60);
            const s = total % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function saveQuizProgress() {
            if (!state.currentUser || !state.activeQuizId || !state.quizEndAt) return;
            PersistStore.setItem(STORAGE_KEYS.INPROGRESS, {
                username: state.currentUser.username,
                quizId: state.activeQuizId,
                endAt: state.quizEndAt,
                answers: state.userAnswers,
                flagged: state.flaggedQuestions,
                variant: state.activeQuizVariant
            });
        }

        function clearQuizProgress() {
            PersistStore.removeItem(STORAGE_KEYS.INPROGRESS);
            state.quizEndAt = null;
            state.flaggedQuestions = {};
            state.navFilterMode = 'all';
        }

        let _quizWakeLock = null;
        async function requestQuizWakeLock() {
            try {
                if ('wakeLock' in navigator && !_quizWakeLock && document.visibilityState === 'visible') {
                    _quizWakeLock = await navigator.wakeLock.request('screen');
                    _quizWakeLock.addEventListener('release', () => { _quizWakeLock = null; });
                }
            } catch (e) { _quizWakeLock = null; }
        }
        function releaseQuizWakeLock() {
            try { if (_quizWakeLock) _quizWakeLock.release(); } catch (e) {}
            _quizWakeLock = null;
        }

        function tickQuizTimer() {
            if (state.currentView !== 'quiz_taking' || !state.quizEndAt) return;
            state.secondsLeft = getQuizRemainingSeconds();
            const timerEl = document.getElementById('live-quiz-timer');
            if (timerEl) timerEl.innerText = formatTimerText(state.secondsLeft);
            if (state.secondsLeft <= 0) {
                showToast('Đã hết thời gian! Hệ thống tự động nộp bài.', 'info');
                processQuizSubmit();
            }
        }

        function startQuizTimer() {
            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(tickQuizTimer, 1000);
            requestQuizWakeLock();
        }

        function stopQuizTimer() {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
            releaseQuizWakeLock();
        }

        function exitQuizNow() {
            stopQuizTimer();
            clearQuizProgress();
            closeModal();
            setTimeout(() => {
                goBackOrNavigate('quiz_preview');
            }, 0);
        }

        // Quay lại ứng dụng (mở khóa màn hình, chuyển tab, bfcache) -> cập nhật lại đồng hồ ngay
        function resyncQuizTimer() {
            if (state.currentView === 'quiz_taking') {
                tickQuizTimer();
                if (state.currentView === 'quiz_taking') requestQuizWakeLock();
            }
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') resyncQuizTimer();
        });
        window.addEventListener('pageshow', resyncQuizTimer);
        window.addEventListener('focus', resyncQuizTimer);

        // Khôi phục bài đang làm dở nếu trình duyệt di động tự tải lại trang
        function tryResumeQuizProgress() {
            const p = PersistStore.getItem(STORAGE_KEYS.INPROGRESS, null);
            if (!p || !state.currentUser || state.role !== 'student') return false;
            if (p.username !== state.currentUser.username) return false;
            const quiz = state.quizzes.find(q => q.id === p.quizId);
            if (!quiz || !canStudentAccessQuiz(quiz) || !p.endAt) {
                PersistStore.removeItem(STORAGE_KEYS.INPROGRESS);
                return false;
            }
            state.activeQuizId = quiz.id;
            state.userAnswers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
            state.flaggedQuestions = (p.flagged && typeof p.flagged === 'object') ? p.flagged : {};
            state.activeQuizVariant = Array.isArray(p.variant) ? p.variant : createQuizVariant(quiz, quiz.shuffleQuestions !== false, quiz.shuffleOptions !== false);
            state.navFilterMode = 'all';
            state.quizEndAt = p.endAt;
            state.secondsLeft = getQuizRemainingSeconds();
            state.currentView = 'quiz_taking';
            return true;
        }

        function finishResumeQuiz() {
            if (state.secondsLeft <= 0) {
                showToast('Đã hết thời gian! Hệ thống tự động nộp bài.', 'info');
                processQuizSubmit();
            } else {
                startQuizTimer();
                showToast('Đã khôi phục bài làm đang dở.', 'success');
            }
        }

        function launchQuizTaking() {
            state.userAnswers = {};
            state.flaggedQuestions = {};
            state.navFilterMode = 'all';
            state.isMobileNavOpen = false;
            const quiz = state.quizzes.find(q => q.id === state.activeQuizId);
            if (!quiz) return;
            state.activeQuizVariant = createQuizVariant(quiz, quiz.shuffleQuestions !== false, quiz.shuffleOptions !== false);

            state.quizEndAt = Date.now() + quiz.duration * 60 * 1000;
            state.secondsLeft = quiz.duration * 60;
            saveQuizProgress();
            navigateView('quiz_taking');
            startQuizTimer();
        }

        // VIEW 3: QUIZ TAKING
        function getFlaggedQuestionsCount(quiz) {
            if (!quiz || !Array.isArray(quiz.questions)) return 0;
            return getActiveQuizQuestions(quiz).reduce((acc, q) => acc + (state.flaggedQuestions[q.id] ? 1 : 0), 0);
        }

        function buildQuestionCardHtml(q, idx) {
            const userAns = state.userAnswers[q.id];
            const isFlagged = !!state.flaggedQuestions[q.id];

            const optionsList = Object.keys(q.options).map(key => {
                if (!q.options[key]) return '';
                const isSelected = userAns === key;
                const borderStyle = isSelected ? 'border-2 border-brand-500 bg-brand-50/60 font-bold text-brand-900 shadow-sm' : 'border border-slate-200 active:bg-slate-50 text-slate-800';

                return `
                    <label onclick="event.preventDefault(); handleSelectQuestionOption(${idx}, '${q.id}', '${key}')" class="flex items-start gap-3 p-4 rounded-2xl cursor-pointer transition-all select-none ${borderStyle}">
                        <input type="radio" name="q_radio_${idx}" value="${key}" ${isSelected ? 'checked' : ''} class="mt-1.5 w-[18px] h-[18px] shrink-0 text-brand-600 focus:ring-brand-500">
                        <div class="flex-1 text-[15px] sm:text-sm leading-relaxed">
                            <strong class="font-bold mr-1">${key}.</strong> ${escapeHtml(q.options[key])}
                        </div>
                    </label>
                `;
            }).join('');

            const cardBorderClass = isFlagged
                ? 'border-amber-300 ring-2 ring-amber-400/25 bg-amber-50/10'
                : 'border-slate-200 bg-white';

            const flagBtnClass = isFlagged
                ? 'bg-amber-500 hover:bg-amber-600 text-white border-amber-500 shadow-sm shadow-amber-500/20'
                : 'bg-slate-50 hover:bg-amber-50 text-slate-600 hover:text-amber-700 border-slate-200 hover:border-amber-300';

            return `
                <div id="card-q-${idx}" class="quiz-card rounded-3xl border ${cardBorderClass} p-4 sm:p-6 shadow-sm space-y-4 transition-all">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <span class="px-3.5 py-1.5 ${isFlagged ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-slate-100 text-slate-700 border-slate-200'} text-xs sm:text-sm font-bold rounded-lg border">
                                Câu ${idx + 1}
                            </span>
                            ${isFlagged ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800 border border-amber-300 text-xs font-bold shadow-2xs"><i class="fa-solid fa-flag text-amber-600 text-[11px]"></i> Đã gắn cờ</span>' : ''}
                        </div>

                        <button type="button" onclick="toggleQuestionFlag(${idx}, '${q.id}')"
                            aria-pressed="${isFlagged ? 'true' : 'false'}"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all active:scale-95 shrink-0 ${flagBtnClass}"
                            title="${isFlagged ? 'Bỏ gắn cờ câu hỏi này' : 'Gắn cờ câu hỏi để xem lại'}">
                            <i class="${isFlagged ? 'fa-solid' : 'fa-regular'} fa-flag"></i>
                            <span>${isFlagged ? 'Bỏ gắn cờ' : 'Gắn cờ'}</span>
                        </button>
                    </div>
                    <h4 class="text-base font-semibold text-slate-900 leading-relaxed transition-all">
                        ${escapeHtml(q.text)}
                    </h4>
                    <div class="space-y-2 pt-1">
                        ${optionsList}
                    </div>
                </div>
            `;
        }

        function buildNavButtonHtml(q, idx, prefix = 'nav-q') {
            const isAns = !!state.userAnswers[q.id];
            const isFlagged = !!state.flaggedQuestions[q.id];
            const isHiddenByFilter = state.navFilterMode === 'flagged' && !isFlagged;

            let btnStyle = isAns
                ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm shadow-emerald-600/20'
                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 active:bg-slate-200';

            if (isFlagged) {
                btnStyle += isAns
                    ? ' ring-2 ring-amber-400 ring-offset-1'
                    : ' !bg-amber-50 !text-amber-800 !border-amber-400 ring-1 ring-amber-400/50';
            }

            const statusLabels = [
                isAns ? 'Đã làm' : 'Chưa làm',
                isFlagged ? 'Đã gắn cờ' : ''
            ].filter(Boolean).join(' • ');

            const flagMarkerHtml = isFlagged
                ? `<span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-amber-500 text-white border-2 border-white flex items-center justify-center text-[8px] shadow-xs pointer-events-none"><i class="fa-solid fa-flag"></i></span>`
                : '';

            return `
                <button type="button" id="${prefix}-${idx}" onclick="scrollToQuestionCard(${idx})"
                    class="${isHiddenByFilter ? 'hidden ' : ''}relative w-full aspect-square min-h-[40px] rounded-xl border font-bold text-xs flex items-center justify-center transition-all ${btnStyle}"
                    title="Câu ${idx + 1}: ${statusLabels}">
                    <span>${idx + 1}</span>
                    ${flagMarkerHtml}
                </button>
            `;
        }

        function renderQuizTakingView(container) {
            const quiz = state.quizzes.find(q => q.id === state.activeQuizId);
            if (!quiz || !canStudentAccessQuiz(quiz)) {
                showToast('Bài kiểm tra không thuộc lớp hiện tại của bạn.', 'error');
                navigateView('student_home');
                return;
            }

            const answeredCount = Object.keys(state.userAnswers).length;
            const questions = getActiveQuizQuestions(quiz);
            const totalCount = questions.length;
            const unansweredCount = Math.max(0, totalCount - answeredCount);
            const flaggedCount = getFlaggedQuestionsCount(quiz);
            const isOnlyFlaggedFilter = state.navFilterMode === 'flagged';

            const questionsHtml = questions.map((q, idx) => buildQuestionCardHtml(q, idx)).join('');
            const desktopGridHtml = questions.map((q, idx) => buildNavButtonHtml(q, idx, 'nav-q-desktop')).join('');
            const mobileGridHtml = questions.map((q, idx) => buildNavButtonHtml(q, idx, 'nav-q-mobile')).join('');
            const timerStr = formatTimerText(state.secondsLeft);

            const isDesktopOpen = state.isDesktopNavOpen !== false;
            const isMobileOpen = !!state.isMobileNavOpen;

            container.innerHTML = `
                <div class="space-y-4 sm:space-y-6 pb-20 lg:pb-6">
                    <!-- Top Sticky Header Bar -->
                    <div class="quiz-bar sticky z-30 bg-white/95 backdrop-blur border border-slate-200 rounded-2xl p-2.5 sm:p-4 shadow-sm flex items-center justify-between gap-2 sm:gap-4">
                        <div class="flex items-center gap-1.5 sm:gap-3 min-w-0 flex-1">
                            <button type="button" onclick="openModal('confirm_exit')" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition shrink-0" aria-label="Thoát">
                                <i class="fa-solid fa-arrow-left text-lg"></i>
                            </button>

                                <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs text-slate-500 mt-0.5">
                                    <span class="hidden sm:inline">Học sinh: <strong class="text-slate-700">${escapeHtml(state.currentUser?.username || state.currentUser?.name)}</strong></span>
                                    <span class="hidden sm:inline">•</span>
                                    <span>Đã làm: <strong id="live-answered-count" class="text-emerald-600">${answeredCount}</strong>/${totalCount}</span>
                                    <span id="live-flagged-wrap" class="${flaggedCount > 0 ? 'inline-flex' : 'hidden'} items-center gap-1 text-amber-600 font-semibold">
                                        <span>•</span>
                                        <i class="fa-solid fa-flag text-[10px]"></i>
                                        <span>Gắn cờ: <strong id="live-flagged-count">${flaggedCount}</strong></span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                            <!-- Nút bật lại bảng câu hỏi trên Máy tính khi đang đóng -->
                            <button type="button" id="desktop-nav-reopen-btn" onclick="toggleDesktopQuizNav(true)" class="${isDesktopOpen ? 'hidden' : 'hidden lg:inline-flex'} items-center gap-2 px-3.5 py-2 bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200 rounded-xl text-xs font-bold transition shadow-sm" title="Mở bảng danh sách câu hỏi">
                                <i class="fa-solid fa-table-cells"></i>
                                <span>Bảng Câu Hỏi (<span id="desktop-reopen-progress">${answeredCount}/${totalCount}</span>)</span>
                            </button>

                            <div class="flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-4 py-2 bg-amber-50 border border-amber-200 rounded-xl text-amber-700 font-bold text-sm sm:text-base tabular-nums">
                                <i class="fa-regular fa-clock text-amber-600"></i>
                                <span id="live-quiz-timer">${timerStr}</span>
                            </div>
                            <button type="button" onclick="openModal('confirm_submit')" class="px-3 sm:px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-emerald-600/20 transition flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i> <span class="hidden min-[420px]:inline">Nộp Bài</span>
                            </button>
                        </div>
                    </div>

                    <!-- Main Content Grid -->
                    <div id="quiz-taking-layout" class="grid grid-cols-1 ${isDesktopOpen ? 'lg:grid-cols-12' : 'lg:grid-cols-1'} gap-4 sm:gap-6 items-start transition-all duration-200">
                        <!-- Questions Vertical Container (tự động phóng to thêm một chút khi đóng bảng bên phải trên máy tính) -->
                        <div id="quiz-questions-column" class="${isDesktopOpen ? 'lg:col-span-8 xl:col-span-9' : 'lg:col-span-1 max-w-6xl w-full mx-auto quiz-expanded-mode'} space-y-4 sm:space-y-6 transition-all duration-200">
                            ${questionsHtml}
                        </div>

                        <!-- Bảng Câu Hỏi Cố Định Bên Tay Phải Trên Máy Tính -->
                        <aside id="desktop-quiz-nav-panel" class="${isDesktopOpen ? 'hidden lg:block lg:col-span-4 xl:col-span-3' : 'hidden'} lg:sticky lg:top-44 bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-4">
                            <div class="flex items-center justify-between gap-2 pb-3 border-b border-slate-100">
                                <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2">

                            <!-- Thống kê nhanh Đã làm / Chưa làm / Đánh dấu -->
                            <div class="grid grid-cols-3 gap-1.5 text-xs">

                                    <span class="block text-[11px] text-emerald-700 font-medium">Đã làm</span>
                                    <strong id="desktop-nav-done" class="text-emerald-800 text-sm">${answeredCount}</strong>

                                    class="px-2.5 py-2 rounded-xl border text-center transition ${isOnlyFlaggedFilter ? 'bg-amber-500 text-white border-amber-500 shadow-xs' : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'}"
                                    title="Bấm để lọc riêng các câu đã gắn cờ">
                                    <span class="block text-[11px] font-medium">Gắn cờ</span>
                                    <strong id="desktop-nav-flagged" class="text-sm">${flaggedCount}</strong>
                                </button>
                            </div>

                            <!-- Bộ lọc nhanh -->
                            <div class="flex items-center justify-between text-[11px]">
                                <div class="inline-flex rounded-lg bg-slate-100 p-0.5">
                                    <button type="button" id="desktop-filter-all" onclick="setNavFilterMode('all')" class="px-2.5 py-1 rounded-md font-bold transition ${!isOnlyFlaggedFilter ? 'bg-white text-slate-800 shadow-2xs' : 'text-slate-500 hover:text-slate-700'}">
                                        Tất cả (${totalCount})
                                    </button>
                                    <button type="button" id="desktop-filter-flagged" onclick="setNavFilterMode('flagged')" class="px-2.5 py-1 rounded-md font-bold transition ${isOnlyFlaggedFilter ? 'bg-amber-500 text-white shadow-2xs' : 'text-slate-500 hover:text-amber-700'}">
                                        Gắn cờ (<span id="desktop-filter-flagged-count">${flaggedCount}</span>)
                                    </button>
                                </div>
                                <button type="button" id="desktop-jump-flagged-btn" onclick="jumpToNextFlaggedQuestion()" class="${flaggedCount > 0 ? 'inline-flex' : 'hidden'} items-center gap-1 text-amber-700 hover:text-amber-800 font-bold hover:underline" title="Nhảy tới câu gắn cờ tiếp theo">
                                    <span>Câu tiếp</span>
                                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                </button>
                            </div>

                            <div id="desktop-nav-empty-flagged" class="${isOnlyFlaggedFilter && flaggedCount === 0 ? '' : 'hidden'} py-6 text-center text-xs text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                                Chưa có câu hỏi nào được gắn cờ.
                            </div>

                            <div class="grid grid-cols-5 gap-2 max-h-[46vh] overflow-y-auto pr-1 pt-1">
                                ${desktopGridHtml}
                            </div>

                            <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-600">
                                <div class="flex items-center gap-1.5">
                                    <span class="w-3 h-3 rounded-md bg-emerald-600 inline-block"></span>
                                    <span class="font-medium text-emerald-700">Đã làm</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <span class="w-3 h-3 rounded-md bg-slate-100 border border-slate-300 inline-block"></span>
                                    <span>Chưa làm</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <span class="w-3.5 h-3.5 rounded-full bg-amber-500 text-white inline-flex items-center justify-center text-[7px]"><i class="fa-solid fa-flag"></i></span>

        function toggleDesktopQuizNav(openState) {
            state.isDesktopNavOpen = !!openState;
            const layout = document.getElementById('quiz-taking-layout');
            const questionsCol = document.getElementById('quiz-questions-column');
            const desktopPanel = document.getElementById('desktop-quiz-nav-panel');
            const reopenBtn = document.getElementById('desktop-nav-reopen-btn');

            if (!layout || !questionsCol || !desktopPanel) return;

            if (state.isDesktopNavOpen) {
                layout.classList.remove('lg:grid-cols-1');
                layout.classList.add('lg:grid-cols-12');
                questionsCol.className = 'lg:col-span-8 xl:col-span-9 space-y-4 sm:space-y-6 transition-all duration-200';
                desktopPanel.className = 'hidden lg:block lg:col-span-4 xl:col-span-3 lg:sticky lg:top-44 bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-4';
                if (reopenBtn) {
                    reopenBtn.classList.add('hidden');
                    reopenBtn.classList.remove('lg:inline-flex');
                }
            } else {
                layout.classList.remove('lg:grid-cols-12');
                layout.classList.add('lg:grid-cols-1');
                questionsCol.className = 'lg:col-span-1 max-w-6xl w-full mx-auto quiz-expanded-mode space-y-4 sm:space-y-6 transition-all duration-200';
                desktopPanel.className = 'hidden';
                if (reopenBtn) {
                    reopenBtn.classList.remove('hidden');
                    reopenBtn.classList.add('lg:inline-flex');
                }
            }
        }

        function toggleMobileQuizNav(openState) {
            state.isMobileNavOpen = !!openState;
            const drawer = document.getElementById('mobile-quiz-nav-drawer');
            if (!drawer) return;
            if (state.isMobileNavOpen) {
                drawer.classList.remove('hidden');
            } else {
                drawer.classList.add('hidden');
            }
        }

        function syncQuizNavStatsAndFilter(quiz) {
            if (!quiz) return;
            const doneCount = Object.keys(state.userAnswers).length;
            const totalCount = getActiveQuizQuestions(quiz).length;
            const todoCount = Math.max(0, totalCount - doneCount);
            const flaggedCount = getFlaggedQuestionsCount(quiz);
            const isOnlyFlagged = state.navFilterMode === 'flagged';

            const countEl = document.getElementById('live-answered-count');
            if (countEl) countEl.innerText = doneCount;

            const flaggedWrapEl = document.getElementById('live-flagged-wrap');
            if (flaggedWrapEl) {
                flaggedWrapEl.classList.toggle('hidden', flaggedCount === 0);
                flaggedWrapEl.classList.toggle('inline-flex', flaggedCount > 0);
            }
            const flaggedCountEl = document.getElementById('live-flagged-count');
            if (flaggedCountEl) flaggedCountEl.innerText = flaggedCount;

            const desktopDoneEl = document.getElementById('desktop-nav-done');
            if (desktopDoneEl) desktopDoneEl.innerText = doneCount;
            const desktopTodoEl = document.getElementById('desktop-nav-todo');
            if (desktopTodoEl) desktopTodoEl.innerText = todoCount;
            const desktopFlaggedEl = document.getElementById('desktop-nav-flagged');
            if (desktopFlaggedEl) desktopFlaggedEl.innerText = flaggedCount;
            const desktopFilterFlaggedCountEl = document.getElementById('desktop-filter-flagged-count');
            if (desktopFilterFlaggedCountEl) desktopFilterFlaggedCountEl.innerText = flaggedCount;
            const desktopReopenEl = document.getElementById('desktop-reopen-progress');
            if (desktopReopenEl) desktopReopenEl.innerText = `${doneCount}/${totalCount}`;

            const mobileFabDoneEl = document.getElementById('mobile-fab-done');
            if (mobileFabDoneEl) mobileFabDoneEl.innerText = doneCount;
            const mobileFabFlagDot = document.getElementById('mobile-fab-flag-dot');
            if (mobileFabFlagDot) mobileFabFlagDot.classList.toggle('hidden', flaggedCount === 0);
            const mobileDoneEl = document.getElementById('mobile-nav-done');
            if (mobileDoneEl) mobileDoneEl.innerText = doneCount;
            const mobileTodoEl = document.getElementById('mobile-nav-todo');
            if (mobileTodoEl) mobileTodoEl.innerText = todoCount;
            const mobileFlaggedEl = document.getElementById('mobile-nav-flagged');
            if (mobileFlaggedEl) mobileFlaggedEl.innerText = flaggedCount;
            const mobileFilterFlaggedCountEl = document.getElementById('mobile-filter-flagged-count');
            if (mobileFilterFlaggedCountEl) mobileFilterFlaggedCountEl.innerText = flaggedCount;

                dFilterBtn.className = `px-2.5 py-2 rounded-xl border text-center transition ${isOnlyFlagged ? 'bg-amber-500 text-white border-amber-500 shadow-xs' : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-200'}`;
            }

            if (mFilterBtn) {
                mFilterBtn.className = `px-3 py-2 rounded-xl border text-center transition ${isOnlyFlagged ? 'bg-amber-500 text-white border-amber-500' : 'bg-amber-50 text-amber-800 border-amber-200'}`;

            if (dFlagTab) dFlagTab.className = `px-2.5 py-1 rounded-md font-bold transition ${isOnlyFlagged ? 'bg-amber-500 text-white shadow-2xs' : 'text-slate-500 hover:text-amber-700'}`;

            const mAllTab = document.getElementById('mobile-filter-all');
            const mFlagTab = document.getElementById('mobile-filter-flagged');

        function setNavFilterMode(mode) {
            state.navFilterMode = mode === 'flagged' ? 'flagged' : 'all';
            const quiz = state.quizzes.find(q => q.id === state.activeQuizId);
            if (!quiz) return;
            getActiveQuizQuestions(quiz).forEach((q, idx) => {
                const navBtnDesktop = document.getElementById(`nav-q-desktop-${idx}`);
                if (navBtnDesktop) navBtnDesktop.outerHTML = buildNavButtonHtml(q, idx, 'nav-q-desktop');
                const navBtnMobile = document.getElementById(`nav-q-mobile-${idx}`);
                if (navBtnMobile) navBtnMobile.outerHTML = buildNavButtonHtml(q, idx, 'nav-q-mobile');
            });
            syncQuizNavStatsAndFilter(quiz);
        }

        function toggleNavFilterMode() {
            setNavFilterMode(state.navFilterMode === 'flagged' ? 'all' : 'flagged');
        }

        let _lastJumpedFlaggedIdx = -1;
        function jumpToNextFlaggedQuestion() {
            const quiz = state.quizzes.find(q => q.id === state.activeQuizId);
            if (!quiz) return;
            const flaggedIndices = getActiveQuizQuestions(quiz)
                .map((q, idx) => (state.flaggedQuestions[q.id] ? idx : -1))
                .filter(idx => idx !== -1);
            if (flaggedIndices.length === 0) return;

            const nextIdx = flaggedIndices.find(idx => idx > _lastJumpedFlaggedIdx);
            const targetIdx = nextIdx !== undefined ? nextIdx : flaggedIndices[0];
            _lastJumpedFlaggedIdx = targetIdx;
            scrollToQuestionCard(targetIdx);
        }

        function toggleQuestionFlag(qIdx, qId) {
            if (state.flaggedQuestions[qId]) {
                delete state.flaggedQuestions[qId];
            } else {
                state.flaggedQuestions[qId] = true;
            }
            saveQuizProgress();

            const quiz = state.quizzes.find(q => q.id === state.activeQuizId);
            const q = quiz && getActiveQuizQuestions(quiz)[qIdx];
            if (!q) return;

            const card = document.getElementById(`card-q-${qIdx}`);
            if (card) card.outerHTML = buildQuestionCardHtml(q, qIdx);

            const navBtnDesktop = document.getElementById(`nav-q-desktop-${qIdx}`);
            if (navBtnDesktop) navBtnDesktop.outerHTML = buildNavButtonHtml(q, qIdx, 'nav-q-desktop');

            const navBtnMobile = document.getElementById(`nav-q-mobile-${qIdx}`);
            if (navBtnMobile) navBtnMobile.outerHTML = buildNavButtonHtml(q, qIdx, 'nav-q-mobile');

            syncQuizNavStatsAndFilter(quiz);
        }

        function handleSelectQuestionOption(qIdx, qId, optionKey) {
            state.userAnswers[qId] = optionKey;

            const card = document.getElementById(`card-q-${qIdx}`);

            const navBtnDesktop = document.getElementById(`nav-q-desktop-${qIdx}`);
            if (navBtnDesktop) navBtnDesktop.outerHTML = buildNavButtonHtml(q, qIdx, 'nav-q-desktop');

            const navBtnMobile = document.getElementById(`nav-q-mobile-${qIdx}`);
            if (navBtnMobile) navBtnMobile.outerHTML = buildNavButtonHtml(q, qIdx, 'nav-q-mobile');

            syncQuizNavStatsAndFilter(quiz);
        }

        function scrollToQuestionCard(qIdx) {
            if (state.isMobileNavOpen) {
                toggleMobileQuizNav(false);
            }
            const card = document.getElementById(`card-q-${qIdx}`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function processQuizSubmit() {
            if (state.currentView !== 'quiz_taking') return; // tránh nộp trùng
            const remainingSec = getQuizRemainingSeconds();
            stopQuizTimer();
            clearQuizProgress();
            closeModal();

            const quiz = state.quizzes.find(q => q.id === state.activeQuizId);
            if (!quiz) return;

            const variantQuestions = getActiveQuizQuestions(quiz);
            let correctCount = 0;
            variantQuestions.forEach(q => {
                if (state.userAnswers[q.id] && state.userAnswers[q.id].toUpperCase() === q.answer.toUpperCase()) {
                    correctCount++;
                }
            });

            const total = variantQuestions.length;
            const wrongCount = total - correctCount;
            const score = total > 0 ? (correctCount / total) * 10 : 0;
            const timeTaken = Math.max(0, (quiz.duration * 60) - remainingSec);

            const submission = {
                id: 'sub_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                quizId: quiz.id,
                quizTitle: quiz.title,
                studentUid: state.currentUser?.uid || '',
                teacherUid: quiz.teacherUid || state.currentUser?.teacherUid || '',
                categoryId: quiz.categoryId,
                username: state.currentUser?.username || 'hocsinh',
                studentName: state.currentUser?.username || state.currentUser?.name || 'Học sinh',
                score: score,
                correctCount: correctCount,
                wrongCount: wrongCount,
                totalQuestions: total,
                timeTakenSec: timeTaken,
                submittedAt: new Date().toLocaleString('vi-VN'),
                userAnswers: { ...state.userAnswers },
                questionsSnapshot: JSON.parse(JSON.stringify(variantQuestions))
            };

            state.submissions.push(submission);
            saveSubmissions();

            state.activeSubmission = submission;
            if (firebaseAuth.currentUser && state.role === 'student' && submission.studentUid && submission.teacherUid) {
                try {
                    await firestoreDb.collection('submissions').doc(submission.id).set({
                        ...submission,
                        submittedAt: submission.submittedAt,
                        submittedAtServer: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast('Đã nộp bài và đồng bộ kết quả lên Firebase.', 'success');
                } catch (err) {
                    console.error('Submission cloud sync failed:', err);
                    showToast('Bài đã chấm trên máy này nhưng chưa đồng bộ kết quả lên cloud: ' + (err.message || 'lỗi Firestore'), 'error');
                }
            }
            navigateView('quiz_result');
        }
